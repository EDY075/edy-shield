name: ci

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy app

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
