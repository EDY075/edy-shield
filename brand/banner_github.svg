<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="50%" stop-color="#0DD8A8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2633" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Fundo dark -->
  <rect width="1280" height="640" fill="#0A0E14"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>
  <rect width="1280" height="640" fill="url(#bg-glow)"/>

  <!-- ═══════════════════════════════════
       ESCUDO VERIFICADO + WORDMARK
       ═══════════════════════════════════ -->
  <g transform="translate(640, 240)">
    <!-- Símbolo (no centro, reduzido) -->
    <g transform="translate(0, -60) scale(1.1)">
      <path d="M28,15 L28,38 L14,52 L14,71 L35,81 L72,81 L81,71 L81,30 L68,15 Z"
        fill="none" stroke="url(#brand-grad)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28,15 L28,38 L14,52 L14,71 L35,81 L72,81 L81,71 L81,47 L81,15 Z"
        fill="url(#brand-grad)" fill-opacity="0.06"/>
      <path d="M30,50 L40,60 L62,36"
        fill="none" stroke="url(#brand-grad)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wordmark -->
    <text x="0" y="45" text-anchor="middle"
          font-family="'Space Grotesk', 'Inter', sans-serif"
          font-weight="800" font-size="56"
          letter-spacing="-0.02"
          fill="#E6EDF3">
      EDY SHIELD
    </text>

    <!-- Tagline -->
    <text x="0" y="72" text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="500" font-size="16"
          letter-spacing="0.12em"
          fill="#22D3EE">
      MODERN DEFENSIVE SECURITY TOOLKIT
    </text>

    <!-- Badges -->
    <g transform="translate(0, 105)">
      <rect x="-210" y="-6" width="100" height="24" rx="6" fill="#12161F" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.7"/>
      <text x="-160" y="11" text-anchor="middle"
            font-family="'JetBrains Mono', monospace" font-size="10"
            font-weight="600" fill="#E6EDF3">Python 3.12</text>

      <rect x="-72" y="-6" width="110" height="24" rx="6" fill="#12161F" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.7"/>
      <text x="-17" y="11" text-anchor="middle"
            font-family="'JetBrains Mono', monospace" font-size="10"
            font-weight="600" fill="#00E5A0">100% STDLIB</text>

      <rect x="55" y="-6" width="90" height="24" rx="6" fill="#12161F" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.7"/>
      <text x="100" y="11" text-anchor="middle"
            font-family="'JetBrains Mono', monospace" font-size="10"
            font-weight="500" fill="#8B949E">BLUE TEAM</text>
    </g>
  </g>

  <!-- Rodapé -->
  <text x="30" y="620"
        font-family="'JetBrains Mono', monospace" font-size="12"
        fill="#8B949E" opacity="0.5">
    github.com/EDY075/edy-shield
  </text>

  <text x="1020" y="620"
        font-family="'Inter', sans-serif" font-size="12"
        fill="#8B949E" opacity="0.5">
    Defenda. Verifique. Confie.
  </text>
</svg>