<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="e-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="rounded-box">
      <rect x="0" y="0" width="128" height="128" rx="20"/>
    </clipPath>
  </defs>

  <!-- Fundo escudo (quadrado com bordas arredondadas, dark) -->
  <rect width="128" height="128" rx="20" fill="#0A0E14"/>

  <!-- Borda brilhante -->
  <rect x="1" y="1" width="126" height="126" rx="19"
    fill="none" stroke="url(#e-grad)" stroke-width="1.5" opacity="0.4"/>

  <!-- E Monograma (estilizado como escudo) -->
  <g transform="translate(64,66)">
    <!-- E como escudo: letra forte com serifa no topo -->
    <text x="0" y="0" text-anchor="middle"
          font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
          font-weight="800" font-size="56"
          fill="url(#e-grad)"
          letter-spacing="-0.02em">
      E
    </text>
  </g>

  <!-- Linha de hash (SHA-256 digest visual) -->
  <g transform="translate(0, 104)" opacity="0.35">
    <!-- Barra de hash: 24 caracteres em formato visual -->
    <rect x="15" y="0" width="10" height="1.5" rx="0.75" fill="#22D3EE"/>
    <rect x="27" y="0" width="12" height="1.5" rx="0.75" fill="#00E5A0"/>
    <rect x="41" y="0" width="8" height="1.5" rx="0.75" fill="#22D3EE"/>
    <rect x="51" y="0" width="14" height="1.5" rx="0.75" fill="#00E5A0"/>
    <rect x="67" y="0" width="10" height="1.5" rx="0.75" fill="#22D3EE"/>
    <rect x="79" y="0" width="9" height="1.5" rx="0.75" fill="#00E5A0"/>
    <rect x="90" y="0" width="11" height="1.5" rx="0.75" fill="#22D3EE"/>
    <rect x="103" y="0" width="10" height="1.5" rx="0.75" fill="#00E5A0"/>
  </g>

  <!-- Indicador de atividade (ponto verde no canto inferior direito) -->
  <circle cx="112" cy="112" r="4" fill="#00E5A0" opacity="0.7"/>
</svg>