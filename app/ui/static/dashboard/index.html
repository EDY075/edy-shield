<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e14">
  <meta name="description" content="EDY Shield — SOC Dashboard para Blue Team">
  <title>EDY Shield — Dashboard</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/logo-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/dashboard/assets/logo-64.png">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body>

  <!-- Auth Overlay (estrutura preparada, hidden por default) -->
  <div id="authOverlay" class="auth-overlay auth-hidden">
    <div class="card" style="width: 400px; max-width: 90vw;">
      <div class="card-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="sidebar-logo"><img src="/icon.svg" alt="EDY Shield" width="32" height="32"></div>
          <span class="card-title">EDY Shield</span>
        </div>
      </div>
      <div class="card-body">
        <p style="color: var(--text-secondary); margin-bottom: 16px;">
          Autenticação necessária para acessar o dashboard.
        </p>
        <!-- Auth form placeholder — implementado em sprint futura -->
        <button class="btn btn-primary" onclick="document.getElementById('authOverlay').classList.add('auth-hidden')" style="width: 100%;">
          Entrar (Demo)
        </button>
      </div>
    </div>
  </div>

  <!-- App Layout -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img src="/icon.svg" alt="EDY Shield" width="32" height="32"></div>
        <div class="sidebar-brand-wrap">
          <span class="sidebar-brand">EDY SHIELD</span>
          <span class="sidebar-tagline">MONITOR · DETECT · RESPOND</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-section-label">Operações</div>
        <button class="nav-item active" data-route="dashboard">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
          <span class="nav-item-label">Dashboard</span>
        </button>
        <button class="nav-item" data-route="alerts">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <span class="nav-item-label">Alert Center</span>
          <span class="nav-item-badge" id="alertBadge" style="display: none;">0</span>
        </button>
        <button class="nav-item" data-route="rules">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
          <span class="nav-item-label">Rules</span>
        </button>
        <button class="nav-item" data-route="assets">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
          <span class="nav-item-label">Assets</span>
        </button>
        <button class="nav-item" data-route="logs">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></span>
          <span class="nav-item-label">Logs</span>
        </button>
        <button class="nav-item" data-route="ioc">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
          <span class="nav-item-label">IOC Manager</span>
        </button>

        <div class="sidebar-section-label">Sistema</div>
        <button class="nav-item" data-route="health">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
          <span class="nav-item-label">System Health</span>
        </button>
        <button class="nav-item" data-route="settings">
          <span class="nav-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          <span class="nav-item-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-status" id="sidebarStatus">
          <div class="sidebar-status-title">STATUS DO SISTEMA</div>
          <div class="sidebar-status-item">
            <span class="sidebar-status-label">API</span>
            <span class="sidebar-status-dot" id="sbApiDot"></span>
            <span class="sidebar-status-value" id="sbApiText">…</span>
          </div>
          <div class="sidebar-status-item">
            <span class="sidebar-status-label">Database</span>
            <span class="sidebar-status-dot" id="sbDbDot"></span>
            <span class="sidebar-status-value" id="sbDbText">…</span>
          </div>
          <div class="sidebar-status-item">
            <span class="sidebar-status-label">Analyzers</span>
            <span class="sidebar-status-dot" id="sbAnaDot"></span>
            <span class="sidebar-status-value" id="sbAnaText">…</span>
          </div>
          <div class="sidebar-status-item">
            <span class="sidebar-status-label">Version</span>
            <span class="sidebar-status-value sidebar-status-value-mono" id="sbVerText">…</span>
          </div>
        </div>
        <button class="sidebar-collapse-btn" id="collapseBtn" title="Recolher/Expandir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="3 6 21 6"/><polyline points="3 18 21 18"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="topbar-btn" id="mobileMenuBtn" style="display: none;" title="Menu">
            &#9776;
          </button>
          <span class="topbar-title" id="topbarTitle">Dashboard</span>
        </div>

        <div class="topbar-center">
          <input type="search" class="topbar-search" placeholder="Buscar alertas, assets, IOCs..." id="globalSearch">
        </div>

        <div class="topbar-right">
          <!-- Theme Toggle (M4.2) -->
          <button class="theme-toggle" id="themeToggle" title="Alternar tema">
            <span class="theme-toggle-icon" id="themeToggleIcon">&#9728;</span>
          </button>
          <!-- Online/Offline Indicator (M4.2) -->
          <div class="online-indicator" id="onlineIndicator">
            <span class="online-indicator-dot"></span>
            <span id="onlineIndicatorText">Verificando...</span>
          </div>
          <!-- WebSocket status placeholder -->
          <div class="ws-status" id="wsStatus" title="WebSocket desconectado">
            <span class="ws-status-dot"></span>
            <span id="wsStatusText">Offline</span>
          </div>
          <!-- Notifications -->
          <button class="topbar-btn" title="Notificações">
            &#128276;
            <span class="topbar-btn-dot" id="notifDot" style="display: none;"></span>
          </button>
          <!-- User Avatar -->
          <div class="topbar-avatar" title="Analista">
            <div class="topbar-avatar-img">A</div>
            <div class="topbar-avatar-info">
              <span class="topbar-avatar-name">Analista</span>
              <span class="topbar-avatar-role">Blue Team</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content (SPA mount point) -->
      <main class="page-container" id="pageContainer">
        <!-- Pages render here dynamically via router -->
      </main>

    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="/dashboard/js/components/toast.js"></script>
  <script src="/dashboard/js/components/components.js"></script>
  <script src="/dashboard/js/router.js"></script>
  <script src="/dashboard/js/pages/dashboard.js"></script>
  <script src="/dashboard/js/pages/alerts.js"></script>
  <script src="/dashboard/js/pages/rules.js"></script>
  <script src="/dashboard/js/pages/assets.js"></script>
  <script src="/dashboard/js/pages/logs.js"></script>
  <script src="/dashboard/js/pages/ioc.js"></script>
  <script src="/dashboard/js/pages/health.js"></script>
  <script src="/dashboard/js/pages/settings.js"></script>
  <script src="/dashboard/js/app.js"></script>
</body>
</html>
