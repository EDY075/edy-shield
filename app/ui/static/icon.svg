<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shield-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0c1e4a"/>
    </linearGradient>
    <linearGradient id="shield-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0cc"/>
      <stop offset="50%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#9090a0"/>
    </linearGradient>
    <clipPath id="shield-clip">
      <path d="M64 8 L108 22 V58 C108 86 88 102 64 122 C40 102 20 86 20 58 V22 Z"/>
    </clipPath>
  </defs>

  <!-- Background dark -->
  <rect width="128" height="128" rx="20" fill="#0a0e14"/>

  <!-- Shield outline (silver/chrome) -->
  <path d="M64 8 L108 22 V58 C108 86 88 102 64 122 C40 102 20 86 20 58 V22 Z"
        fill="none" stroke="url(#shield-edge)" stroke-width="2.5" opacity="0.9"/>

  <!-- Shield interior (blue gradient) -->
  <path d="M64 12 L104 24 V58 C104 82 86 98 64 118 C42 98 24 82 24 58 V24 Z"
        fill="url(#shield-grad)"/>

  <!-- ES monogram (white) centered -->
  <text x="64" y="72" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="900" font-size="38"
        fill="#ffffff"
        letter-spacing="-1px">ES</text>

  <!-- Circuit traces at bottom of shield -->
  <g opacity="0.5" stroke="#60a5fa" stroke-width="1" fill="none">
    <path d="M38 88 L48 88 L48 84 L58 84"/>
    <circle cx="58" cy="84" r="1.5" fill="#60a5fa"/>
    <path d="M70 84 L80 84 L80 88 L90 88"/>
    <circle cx="70" cy="84" r="1.5" fill="#60a5fa"/>
    <path d="M42 94 L52 94"/>
    <circle cx="42" cy="94" r="1.2" fill="#60a5fa"/>
    <path d="M76 94 L86 94"/>
    <circle cx="86" cy="94" r="1.2" fill="#60a5fa"/>
  </g>
</svg>
